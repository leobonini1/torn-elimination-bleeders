<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Elimination Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #0f1115;
            color: #e8e8e8;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #181b21;
            border: 1px solid #292e38;
            border-radius: 10px;
            padding: 18px;
        }

        .stat-title {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input {
            background: #181b21;
            color: white;
            border: 1px solid #303640;
            border-radius: 7px;
            padding: 11px 13px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            background: #252a33;
            color: white;
            border: 1px solid #383f4b;
            border-radius: 7px;
            padding: 10px 15px;
            cursor: pointer;
        }

        button:hover {
            background: #303641;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .admin-controls {
            display: none;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .login-area {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-left: auto;
        }

        .login-form {
            display: none;
            gap: 8px;
            align-items: center;
        }

        .admin-status {
            color: #7ee787;
            font-size: 14px;
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #181b21;
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            padding: 13px 15px;
            text-align: left;
            border-bottom: 1px solid #292e38;
        }

        th {
            color: #888;
            font-size: 12px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .player {
            font-weight: bold;
        }

        .player a {
    text-decoration: none;
}

.player a.has-bounty {
    color: #7ee787;
}

.player a.no-bounty {
    color: #ff7777;
}

.player a:hover {
    text-decoration: underline;
}

        .remove-button {
            margin-left: 10px;
            padding: 5px 8px;
            font-size: 11px;
            display: none;
        }

        .status {
            color: #aaa;
        }

        .hospital {
            color: #ff7777;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .login-area {
                width: 100%;
                margin-left: 0;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>⚡ Elimination Dashboard</h1>


    <!-- Statistics -->

    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                Players Tracked
            </div>

            <div
                class="stat-value"
                id="playersCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Hospitalized
            </div>

            <div
                class="stat-value"
                id="hospitalCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Total Bounties
            </div>

            <div
                class="stat-value"
                id="bountyCount"
            >
                $0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Active Recently
            </div>

            <div
                class="stat-value"
                id="activeCount"
            >
                0
            </div>

        </div>

    </div>


    <!-- Controls -->

    <div class="controls">

        <div
            class="admin-controls"
            id="adminControls"
        >

            <input
                type="text"
                id="playerId"
                placeholder="Enter TORN player ID..."
            >

            <button
                onclick="addPlayer()"
            >
                Add Player
            </button>

        </div>


        <button
            onclick="refreshPlayers()"
            id="refreshButton"
        >
            Refresh
        </button>


        <input
            type="text"
            id="search"
            placeholder="Search player..."
            oninput="filterPlayers()"
        >


        <div class="login-area">

            <div
                class="login-form"
                id="loginForm"
            >

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Admin password"
                >

                <button
                    onclick="login()"
                >
                    Login
                </button>

            </div>


            <button
                id="loginButton"
                onclick="showLogin()"
            >
                Admin Login
            </button>


            <span
                class="admin-status"
                id="adminStatus"
            >
                ✓ Admin
            </span>


            <button
                id="logoutButton"
                onclick="logout()"
                style="display: none;"
            >
                Logout
            </button>

        </div>

    </div>


    <!-- Player table -->

    <table>

        <thead>

            <tr>

                <th>
                    PLAYER
                </th>

                <th>
                    BOUNTY
                </th>

                <th>
                    LAST ACTIVE
                </th>

                <th>
                    HOSPITAL
                </th>

                <th>
                    STATUS
                </th>

            </tr>

        </thead>


        <tbody id="playersTable">

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >
                    Loading...
                </td>

            </tr>

        </tbody>

    </table>

</div>


<script>

let players = [];

let isAdmin = false;


/* Escape HTML */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* Load players */

async function loadPlayers() {

    try {

        const response =
            await fetch("/api/players");

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.error ||
                "Failed to load players"
            );

        }

        players =
            data.players || [];

        renderPlayers(players);

        updateStats();

    } catch (error) {

        console.error(error);

        document.getElementById(
            "playersTable"
        ).innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="empty"
                >
                    Failed to load players.
                </td>
            </tr>
        `;

    }

}


/* Render players */

function renderPlayers(list) {

    const table =
        document.getElementById(
            "playersTable"
        );

    list = [...list].sort((a, b) => {

        const aHospital =
            a.status === "Hospital" &&
            a.hospital_until
                ? Number(a.hospital_until)
                : Infinity;

        const bHospital =
            b.status === "Hospital" &&
            b.hospital_until
                ? Number(b.hospital_until)
                : Infinity;

        return aHospital - bHospital;

    });


    if (!list.length) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="empty"
                >
                    No players tracked.
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        list.map(player => {

            const hospital =
                player.hospital_until
                    ? new Date(
                        Number(
                            player.hospital_until
                        ) * 1000
                    )
                    : null;


          let hospitalText = "—";

if (
    player.status === "Hospital" &&
    hospital
) {

    const remaining =
        hospital.getTime() - Date.now();

    if (remaining > 0) {

        const totalSeconds =
            Math.floor(remaining / 1000);

        const hours =
            Math.floor(totalSeconds / 3600);

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;


        if (hours > 0) {

            hospitalText =
                `${hours}h ${minutes}m ${seconds}s`;

        } else {

            hospitalText =
                `${minutes}m ${seconds}s`;

        }

    } else {

        hospitalText =
            "Finished";

    }

}


            const status =
                player.status || "Unknown";


            return `

                <tr>

                    <td class="player">

                        <a
    href="https://www.torn.com/bounties.php?p=add&XID=${player.id}"
    target="_blank"
    rel="noopener noreferrer"
>
    ${escapeHtml(player.name)}
</a>

                        <button
                            class="remove-button"
                            data-player-id="${player.id}"
                            onclick="removePlayer(${player.id})"
                            style="display: ${
                                isAdmin
                                    ? "inline-block"
                                    : "none"
                            };"
                        >
                            Remove
                        </button>

                    </td>


                    <td>
                        $${Number(
                            player.bounty || 0
                        ).toLocaleString()}
                    </td>


                    <td>
                        ${escapeHtml(
                            player.last_active ||
                            "Unknown"
                        )}
                    </td>


                    <td
                        class="${
                            status === "Hospital"
                                ? "hospital"
                                : ""
                        }"
                    >
                        ${escapeHtml(
                            hospitalText
                        )}
                    </td>


                    <td class="status">
                        ${escapeHtml(status)}
                    </td>

                </tr>

            `;

        }).join("");

}


/* Update statistics */

function updateStats() {

    document.getElementById(
        "playersCount"
    ).textContent =
        players.length;


    document.getElementById(
        "hospitalCount"
    ).textContent =
        players.filter(
            player =>
                player.status === "Hospital"
        ).length;


    const totalBounty =
        players.reduce(
            (total, player) =>
                total +
                Number(
                    player.bounty || 0
                ),
            0
        );


    document.getElementById(
        "bountyCount"
    ).textContent =
        "$" +
        totalBounty.toLocaleString();


    document.getElementById(
        "activeCount"
    ).textContent =
        players.filter(
            player =>
                player.last_active &&
                !player.last_active
                    .toLowerCase()
                    .includes("day")
        ).length;

}


/* Search */

function filterPlayers() {

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    if (!search) {

        renderPlayers(players);

        return;

    }


    const filtered =
        players.filter(player =>
            String(
                player.name || ""
            )
            .toLowerCase()
            .includes(search)
        );


    renderPlayers(filtered);

}


/* Check login status */

async function checkAuth() {

    try {

        const response =
            await fetch(
                "/api/auth-status"
            );

        const data =
            await response.json();

        setAdminState(
            data.admin === true
        );

    } catch (error) {

        console.error(
            "Auth check failed:",
            error
        );

        setAdminState(false);

    }

}


/* Update admin UI */

function setAdminState(admin) {

    isAdmin = admin;


    document.getElementById(
        "adminControls"
    ).style.display =
        admin ? "flex" : "none";


    document.getElementById(
        "loginButton"
    ).style.display =
        admin ? "none" : "inline-block";


    document.getElementById(
        "adminStatus"
    ).style.display =
        admin ? "inline" : "none";


    document.getElementById(
        "logoutButton"
    ).style.display =
        admin ? "inline-block" : "none";


    document.getElementById(
        "loginForm"
    ).style.display =
        "none";


    renderPlayers(
        players
    );

}


/* Show login */

function showLogin() {

    document.getElementById(
        "loginButton"
    ).style.display = "none";


    document.getElementById(
        "loginForm"
    ).style.display = "flex";


    document.getElementById(
        "adminPassword"
    ).focus();

}


/* Login */

async function login() {

    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    if (!password) {

        alert(
            "Please enter the admin password."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            password
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Login failed"
            );

        }


        document.getElementById(
            "adminPassword"
        ).value = "";


        setAdminState(true);


    } catch (error) {

        console.error(error);

        alert(
            "Login failed: " +
            error.message
        );

    }

}


/* Allow Enter key to login */

document.getElementById(
    "adminPassword"
).addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            login();

        }

    }
);


/* Logout */

async function logout() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.error(error);

    }


    setAdminState(false);

}


/* Add or refresh a player */

async function addPlayer() {

    if (!isAdmin) {

        alert(
            "Admin login required."
        );

        return;

    }


    const input =
        document.getElementById(
            "playerId"
        );


    const playerId =
        input.value.trim();


    if (!/^\d+$/.test(playerId)) {

        alert(
            "Please enter a valid TORN player ID."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `/api/player/${playerId}`,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (
            response.status === 401
        ) {

            setAdminState(false);

            throw new Error(
                "Your admin session has expired."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Failed to add player"
            );

        }


        input.value = "";


        await loadPlayers();


        alert(
            `${data.player.name} was added/refreshed successfully.`
        );


    } catch (error) {

        console.error(error);

        alert(
            "Failed to add player: " +
            error.message
        );

    }

}


/* Remove a player */

async function removePlayer(
    playerId
) {

    if (!isAdmin) {

        alert(
            "Admin login required."
        );

        return;

    }


    const player =
        players.find(
            player =>
                Number(player.id) ===
                Number(playerId)
        );


    const playerName =
        player
            ? player.name
            : "this player";


    const confirmed =
        confirm(
            `Are you sure you want to remove ${playerName}?`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/remove-player/${playerId}`,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (
            response.status === 401
        ) {

            setAdminState(false);

            throw new Error(
                "Your admin session has expired."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Failed to remove player"
            );

        }


        await loadPlayers();


    } catch (error) {

        console.error(error);

        alert(
            "Failed to remove player: " +
            error.message
        );

    }

}


/* Refresh all tracked players */

async function refreshPlayers() {

    const button =
        document.getElementById(
            "refreshButton"
        );


    button.disabled = true;

    button.textContent =
        "Refreshing...";


    try {

        const response =
            await fetch(
                "/api/refresh-players"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Failed to refresh players"
            );

        }


        await loadPlayers();


        console.log(
            `Refreshed ${data.refreshed} players. Failed: ${data.failed}`
        );


    } catch (error) {

        console.error(error);

        alert(
            "Failed to refresh players: " +
            error.message
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "Refresh";

    }

}


/* Update hospital countdown every second */

setInterval(() => {

    if (players.length > 0) {

        renderPlayers(players);

    }

}, 1000);


/* Check players whose hospital timer has expired */

setInterval(async () => {

    try {

        const response =
            await fetch(
                "/api/refresh-expired"
            );

        const data =
            await response.json();

        if (
            data.success &&
            data.checked > 0
        ) {

            await loadPlayers();

        }

    } catch (error) {

        console.error(
            "Expired player refresh failed:",
            error
        );

    }

}, 10000);


/* Initial load */

async function initialize() {

    await checkAuth();

    await loadPlayers();

}


initialize();

</script>

</body>

</html>
