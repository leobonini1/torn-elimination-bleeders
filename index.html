<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elimination Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }
        button {
    background: #292d31;
    border: 1px solid #3a3f44;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #34393e;
}

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111315;
            color: #e8e8e8;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            color: #888;
            margin-top: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat {
            background: #1b1e21;
            border: 1px solid #292d31;
            border-radius: 8px;
            padding: 20px;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: bold;
        }
        .remove-button {
    margin-left: 10px;
    padding: 6px 10px;
    font-size: 12px;
    background: #1b1e21;
    border: 1px solid #555;
    color: #aaa;
}

.remove-button:hover {
    background: #333;
    color: white;
}

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            background: #1b1e21;
            border: 1px solid #33383d;
            color: white;
            padding: 12px;
            border-radius: 6px;
            width: 300px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .table-container {
            background: #1b1e21;
            border: 1px solid #292d31;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #999;
            font-size: 13px;
            font-weight: normal;
            padding: 15px;
            border-bottom: 1px solid #292d31;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #24272a;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .player {
            font-weight: bold;
        }

        .bounty {
            font-weight: bold;
        }

        .hospital {
            color: #e5a84b;
        }

        .active {
            color: #72c472;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .updated {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 15px;
            }

            input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>⚡ Elimination Dashboard</h1>

        <div class="subtitle">
            Player activity, bounties and hospital status
        </div>

        <div class="updated">
            Last updated: <span id="lastUpdated">Never</span>
        </div>
    </header>


    <section class="stats">

        <div class="stat">
            <div class="stat-label">PLAYERS TRACKED</div>
            <div class="stat-value" id="playerCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">HOSPITALIZED</div>
            <div class="stat-value" id="hospitalCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">TOTAL BOUNTIES</div>
            <div class="stat-value" id="totalBounty">$0</div>
        </div>

        <div class="stat">
            <div class="stat-label">ACTIVE RECENTLY</div>
            <div class="stat-value" id="activeCount">0</div>
        </div>

    </section>


    <div class="controls">

    <input
        type="text"
        id="playerId"
        placeholder="Enter TORN player ID..."
    >

    <button onclick="addPlayer()">
        Add Player
    </button>

    <input
        type="text"
        id="search"
        placeholder="Search player..."
        oninput="filterPlayers()"
    >

</div>


    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>PLAYER</th>
                    <th>BOUNTY</th>
                    <th>LAST ACTIVE</th>
                    <th>HOSPITAL</th>
                    <th>STATUS</th>
                </tr>

            </thead>

            <tbody id="playerTable">

                <tr>
                    <td colspan="5" class="empty">
                        Loading players...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

let players = [];


/* Load players from D1 */
async function loadPlayers() {

    try {

        const response = await fetch("/api/players");

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Failed to load players");
        }

        players = data.players || [];

        renderPlayers(players);

        updateStats(players);

        document.getElementById("lastUpdated").textContent =
            new Date().toLocaleString();

    } catch (error) {

        console.error(error);

        document.getElementById("playerTable").innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Failed to load players
                </td>
            </tr>
        `;

    }

}


/* Display players in the table */
function renderPlayers(playerList) {

    const table = document.getElementById("playerTable");

    if (playerList.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No players tracked yet
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = playerList.map(player => {

        const bounty = Number(player.bounty || 0);

        const hospital = player.hospital_until
            ? formatHospital(player.hospital_until)
            : "-";

        const status = player.status || "-";


        return `
            <tr>

              <td class="player">
    ${escapeHtml(player.name)}
    <button
        class="remove-button"
        onclick="removePlayer(${player.id})"
    >
        Remove
    </button>
</td>

                <td class="bounty">
                    $${bounty.toLocaleString()}
                </td>

                <td>
                    ${escapeHtml(player.last_active || "-")}
                </td>

                <td class="${status === "Hospital" ? "hospital" : ""}">
                    ${hospital}
                </td>

                <td class="${status === "Hospital" ? "hospital" : "active"}">
                    ${escapeHtml(status)}
                </td>

            </tr>
        `;

    }).join("");

}


/* Update dashboard statistics */
function updateStats(playerList) {

    const playerCount = playerList.length;

    const hospitalCount = playerList.filter(
        player => player.status === "Hospital"
    ).length;

    const totalBounty = playerList.reduce(
        (total, player) => total + Number(player.bounty || 0),
        0
    );

    const activeCount = playerList.filter(
        player => player.last_active &&
        (
            player.last_active.includes("minute") ||
            player.last_active.includes("second")
        )
    ).length;


    document.getElementById("playerCount").textContent =
        playerCount;

    document.getElementById("hospitalCount").textContent =
        hospitalCount;

    document.getElementById("totalBounty").textContent =
        "$" + totalBounty.toLocaleString();

    document.getElementById("activeCount").textContent =
        activeCount;

}


/* Search players */
function filterPlayers() {

    const search =
        document.getElementById("search").value.toLowerCase();

    const filtered = players.filter(player =>
        player.name.toLowerCase().includes(search)
    );

    renderPlayers(filtered);

}


/* Convert hospital timestamp to readable time */
function formatHospital(timestamp) {

    const unix = Number(timestamp);

    if (!unix) {
        return "-";
    }

    const now = Math.floor(Date.now() / 1000);

    const remaining = unix - now;

    if (remaining <= 0) {
        return "Finished";
    }

    const minutes = Math.floor(remaining / 60);

    const hours = Math.floor(minutes / 60);

    const mins = minutes % 60;


    if (hours > 0) {
        return `${hours}h ${mins}m`;
    }

    return `${mins}m`;
}


/* Prevent player names from inserting HTML */
function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;

}

/* Remove a player */
async function removePlayer(playerId) {

    const player = players.find(
        player => Number(player.id) === Number(playerId)
    );

    const playerName = player ? player.name : "this player";

    const confirmed = confirm(
        `Are you sure you want to remove ${playerName}?`
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            `/api/remove-player/${playerId}`
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(
                data.error || "Failed to remove player"
            );
        }

        await loadPlayers();

    } catch (error) {

        console.error(error);

        alert(
            "Failed to remove player: " + error.message
        );

    }

}
/* Load immediately */
loadPlayers();

</script>

</body>
</html>
